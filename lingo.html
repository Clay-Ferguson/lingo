<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TTS Reader — Read selection or full text</title>
  <link rel="stylesheet" href="lingo.css">
</head>
<body>
  <div class="topbar" role="region" aria-label="TTS controls">
    <div class="app-name">Lingo</div>
    <div class="controls-left">
      <div class="tts-panel">
        <button id="readBtn" title="Read selection or full text (Ctrl/Cmd+Enter)">🔊 Read</button>
        <button id="stopBtn" style="display:none" title="Stop speaking (Esc)">⏹️ Stop</button>
        <button id="pauseBtn" style="display:none" title="Pause speaking">⏸️ Pause</button>
        <button id="resumeBtn" style="display:none" title="Resume speaking">▶️ Resume</button>
        <div class="selects" aria-hidden="false">
          <label for="voiceSelect" style="display:none">Voice</label>
          <select id="voiceSelect" aria-label="Choose voice"></select>

          <label for="rateSelect" style="display:none">Speed</label>
          <select id="rateSelect" aria-label="Choose speaking speed">
            <option value="0.85">0.85 — Slow</option>
            <option value="1" selected>1.0 — Normal</option>
            <option value="1.15">1.15 — Faster</option>
            <option value="1.25">1.25 — Fastest</option>
            <option value="1.3">1.35 — Ludicrous</option>
          </select>
        </div>
      </div>
      <button id="micBtn" title="Start/Stop Speech Recognition (Ctrl/Cmd+M)">🎤 Mic</button>
      <button id="copyBtn" title="Copy text to clipboard">📋 Copy</button>
      <button id="clearBtn" title="Clear all text">🗑️ Clear</button>
    </div>
    <div class="status" id="status">Ready</div>
  </div>

  <div class="container">
    <textarea id="text" placeholder="Type or paste text here... (select part of this text to read just the selection)"></textarea>
  </div>

  <script src="lingo.js"></script>
</body>
</html>
